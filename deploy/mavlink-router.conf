# /etc/mavlink-router/main.conf on the reference computer, an Orange Pi Zero 3W (Allwinner A733, sun60iw2):
# the flight controller on UART2, and a TCP server on port 5678 that DroneStats, and a ground station if
# there is one, connect to. Prof. Peter Burke's installmavlinkrouterorangepizero3w writes this same file
# (https://github.com/PeterJBurke/installmavlinkrouterorangepizero3w), and the wiring notes below follow
# its README.
#
# UART2 needs `overlays=uart2` in /boot/orangepiEnv.txt. On the 40-pin header:
#   pin 11  UART2 TX  -> flight controller RX
#   pin 13  UART2 RX  <- flight controller TX
#   pin 9   GND       -- flight controller GND (power the two separately; share only ground)
# /dev/ttyS0 is the debug console and /dev/ttyS1 the on-board Bluetooth, so neither will do.

[General]
TcpServerPort=5678
ReportStats=false
MavlinkDialect=auto

[UartEndpoint fc]
# The same speed as that port on the flight controller (ArduPilot: SERIALn_BAUD 57, SERIALn_PROTOCOL 2)
# and as install.sh's --baud, which is how the page works out how full the link is.
Device = /dev/ttyS2
Baud = 57600
